name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Build WASM binary
        run: cargo build --target wasm32-wasip1 --release

      - name: Prepare release assets
        run: |
          cp target/wasm32-wasip1/release/mcp_server_github.wasm extension.wasm
          tar czf mcp-server-github-${{ github.ref_name }}.tar.gz extension.wasm extension.toml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            extension.wasm
            mcp-server-github-${{ github.ref_name }}.tar.gz