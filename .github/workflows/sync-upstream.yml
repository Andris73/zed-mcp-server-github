name: Sync Upstream to custom-github-host

on:
  push:
    branches: [main]

jobs:
  merge-to-custom:
    name: Merge main → custom-github-host
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-github-host
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into custom-github-host
        run: |
          git fetch origin main
          git merge origin/main --no-edit -m "chore: merge upstream main into custom-github-host"

      - name: Push merge commit
        run: git push origin custom-github-host